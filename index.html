<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="Description" content="This is a news update app">
        <title>My First website</title>
</head>
<body>
    <header>
       <h1>Welcome to my website</h1>
       <p> A simple place which is helpful to find latest news</p>


    </header>
    <nav>
       <ul>
          <li><a href="https://claude.ai/">search</a></li>
       </ul>
    </nav>
    <hr>
    <main>
        <section>
           <h2>About app</h2>
           <p> A simple app to get daily news and stay updated. It also helps users prepare for government exams by providing current affairs.</p>
        </section>
        <section>
            <h2>Contact Us</h2>
            <form action="/submit-form" method="POST">
                <p>
                    <label for="email">Email </label><br>
                    <input type="email" id="email" name="user_email">
                </p>
                <p>
                    <label for="message">Type complaint or opinion:</label><br>
                    <textarea id="message" name="user_message" rows="4" cols="30"></textarea>
                </p>
                <p>
                    <button type="submit">Submit</button>
                </p>
            </form>
        </section>




    </main>
    <footer>
        <p>&copy; 2026 My Website Project.All rights reserved</p>


    </footer>
        
    
</body>
</html>
